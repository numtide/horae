# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # A merge queue builds a temporary commit and reports on it via merge_group.
  # Without this the required checks never run there and the queue stalls.
  merge_group:

jobs:
  check:
    name: Flake Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Nix binary cache (GitHub Actions cache)
        uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527 # v2

      - name: Flake check
        # Keep the package, test, Clippy and SQLx builds within the runner budget.
        run: nix flake check -L --max-jobs 1 --cores 2

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@a49548c11d9846ad46ecc0115273879b045f001c # v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      - name: Nix binary cache (GitHub Actions cache)
        uses: Mic92/hestia@fb239a2f72d4b6e26eec5425f289dea23b27a527 # v2

      - name: Check formatting
        run: nix fmt -- --ci
