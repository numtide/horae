<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Instrument+Sans:wght@400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#0b0a08; }
  .banner {
    width:1280px; height:420px; position:relative; overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% -10%, #17140d 0%, #100F0C 45%, #0c0b08 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Instrument Sans', system-ui, sans-serif;
  }
  /* Warm sun glow behind the mark */
  .glow {
    position:absolute; top:112px; left:50%; transform:translateX(-50%);
    width:520px; height:520px; border-radius:50%;
    background:radial-gradient(circle, rgba(217,154,60,.22) 0%, rgba(217,154,60,.07) 38%, transparent 66%);
    filter:blur(6px);
  }
  /* Faint concentric rays echoing the icon's sun */
  .rings { position:absolute; top:112px; left:50%; transform:translateX(-50%); opacity:.5; }
  .content { position:relative; display:flex; flex-direction:column; align-items:center; }
  .lockup { width:660px; height:auto; display:block; filter:drop-shadow(0 8px 30px rgba(0,0,0,.55)); }
  .tagline {
    margin-top:30px; font-family:'Newsreader', Georgia, serif; font-weight:400;
    font-size:29px; letter-spacing:.005em; color:#D8D1C4;
  }
  .tagline b { color:#EFEAE0; font-weight:600; }
  .meta {
    margin-top:16px; font-size:14.5px; font-weight:500; letter-spacing:.22em;
    text-transform:uppercase; color:#8a8270;
  }
  .meta .dot { color:#3D9E84; margin:0 9px; }
  /* hairline horizon at the base */
  .base { position:absolute; left:0; right:0; bottom:0; height:1px;
    background:linear-gradient(90deg, transparent, #322E26 20%, #322E26 80%, transparent); }
</style>
</head>
<body>
<div class="banner">
  <div class="glow"></div>
  <svg class="rings" width="560" height="560" viewBox="0 0 560 560" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="280" cy="280" r="150" stroke="#D99A3C" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="280" cy="280" r="215" stroke="#D99A3C" stroke-opacity="0.07" stroke-width="1"/>
    <circle cx="280" cy="280" r="278" stroke="#1F5C4D" stroke-opacity="0.16" stroke-width="1"/>
  </svg>
  <div class="content">
    <!-- Official Horae lockup (icon + wordmark), scaled up -->
    <svg class="lockup" viewBox="0 0 360 96" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="dk-clip"><rect width="128" height="128" rx="30"/></clipPath>
        <filter id="dk-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="5"/>
        </filter>
      </defs>
      <svg x="0" y="0" width="96" height="96" viewBox="0 0 128 128">
        <rect width="128" height="128" rx="30" fill="#1F5C4D"/>
        <line x1="64" y1="70" x2="64" y2="24" stroke="#E7C079" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="64" y1="70" x2="57" y2="35" stroke="#E4B061" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="64" y1="70" x2="71" y2="35" stroke="#E4B061" stroke-width="2.5" stroke-linecap="round"/>
        <circle cx="64" cy="70" r="33" fill="#D99A3C" opacity="0.35" filter="url(#dk-glow)"/>
        <circle cx="64" cy="70" r="29" fill="#D99A3C"/>
        <rect y="85" width="128" height="2"  fill="#0F3D33" clip-path="url(#dk-clip)"/>
        <rect y="87" width="128" height="41" fill="#164034" clip-path="url(#dk-clip)"/>
      </svg>
      <text x="116" y="67" font-family="'Newsreader', Georgia, serif" font-size="80" font-weight="500" letter-spacing="-1.6" fill="#EFEAE0">Horae</text>
      <circle cx="346" cy="65" r="5" fill="#D99A3C"/>
    </svg>
    <div class="tagline">Self-hostable time tracking — <b>Harvest, but fully yours.</b></div>
    <div class="meta">Rust<span class="dot">·</span>Dioxus<span class="dot">·</span>PostgreSQL<span class="dot">·</span>Axum</div>
  </div>
  <div class="base"></div>
</div>
</body>
</html>
