<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<style> body { margin:0; background:#100F0C; } </style>
</helmet>
<i class="{{ cls }}" aria-hidden="true" style="{{ style }}"></i>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:64,&quot;height&quot;:64},&quot;name&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;clock&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Icon&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:16,&quot;min&quot;:12,&quot;max&quot;:48,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Icon&quot;},&quot;weight&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;regular&quot;,&quot;bold&quot;],&quot;default&quot;:&quot;regular&quot;,&quot;tsType&quot;:&quot;'regular'|'bold'&quot;,&quot;section&quot;:&quot;Icon&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#EFEAE0&quot;,&quot;options&quot;:[&quot;#EFEAE0&quot;,&quot;#8F8676&quot;,&quot;#4FB79A&quot;,&quot;#D99A3C&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Icon&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const name = p.name ?? 'clock';
    const weight = p.weight ?? 'regular';
    const size = p.size ?? 16;
    return {
      cls: (weight === 'bold' ? 'ph-bold' : 'ph') + ' ph-' + name,
      style: 'font-size:' + size + 'px; line-height:1; display:block; color:' + (p.color ?? 'currentColor') + ';',
    };
  }
}
</script>
</body>
</html>
