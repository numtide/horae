<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { margin:0; background:#100F0C; }
  * { box-sizing:border-box; }
  button, .hm-row, .hm-chip, .hm-ws { transition: background .14s ease, transform .08s ease, box-shadow .16s ease, border-color .14s ease, color .14s ease; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(79,183,154,.35) !important; }
  button:disabled { cursor: not-allowed; transform: none !important; box-shadow: none !important; }
  .hb-primary:hover:not(:disabled) { background:#63C9AC !important; box-shadow:0 6px 18px -8px rgba(79,183,154,.65) !important; }
  .hb-solid:hover:not(:disabled) { background:#27705E !important; box-shadow:0 6px 18px -8px rgba(31,92,77,.7) !important; }
  .hb-accent:hover:not(:disabled) { background:#E5AB52 !important; box-shadow:0 6px 18px -8px rgba(217,154,60,.6) !important; }
  .hb-secondary:hover:not(:disabled) { background:#2C2820 !important; border-color:#5A5446 !important; }
  .hb-ghost:hover:not(:disabled) { background:rgba(79,183,154,.10) !important; color:#6ECAB0 !important; }
  .hb-danger:hover:not(:disabled) { background:rgba(224,102,97,.12) !important; border-color:#8D4441 !important; color:#EC8683 !important; }
  .hb-icon:hover:not(:disabled) { background:#2C2820 !important; border-color:#5A5446 !important; color:#EFEAE0 !important; }
  .hb-caret:hover:not(:disabled) { background:#1B5347 !important; }
  .hm-row:hover { background:#2A2620 !important; }
  .hm-row:hover .hm-ico { color:#EFEAE0 !important; }
  .hm-danger:hover { background:rgba(224,102,97,.12) !important; color:#EC8683 !important; }
  .hm-ws:hover { background:#2A2620 !important; }
  .hm-chip:hover { background:#2C2820 !important; }
  ::selection { background:#1F5C4D; color:#F6F2E9; }
  ::-moz-selection { background:#1F5C4D; color:#F6F2E9; }
  * { scrollbar-width: thin; scrollbar-color: #3D382E transparent; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:#3D382E; border-radius:999px; border:2px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover { background:#5A5446; background-clip:content-box; }
  ::-webkit-scrollbar-corner { background:transparent; }
  a { color:#4FB79A; text-decoration:none; }
  a:hover { color:#6ECAB0; }
  .hz-opt { transition: box-shadow .14s ease; }
  .hz-opt:hover { box-shadow: inset 0 0 0 999px rgba(239,234,224,.05); }
  .hz-link { transition: color .14s ease; }
  .hz-link:hover { color:#6ECAB0 !important; }
  .hz-link-muted { transition: color .14s ease; }
  .hz-link-muted:hover { color:#EFEAE0 !important; }
  .hz-row-link { transition: color .14s ease; }
  .hz-row-link:hover { color:#4FB79A !important; }
  @media (max-width: 1320px) {
    .hz-rail { width:216px !important; flex-basis:216px !important; }
    .hz-split { gap:32px !important; padding-left:24px !important; padding-right:24px !important; }
    .hz-pad { padding-left:24px !important; padding-right:24px !important; }
  }
  @media (max-width: 1180px) {
    .hz-split { flex-direction:column !important; gap:24px !important; }
    .hz-subnav { width:100% !important; flex:none !important; }
    .hz-subnav > div:first-child { max-width:420px; }
    .hz-subnav > div:not(:first-child) { flex-direction:row !important; flex-wrap:wrap !important; gap:8px !important; }
  }
  @media (max-width: 900px) {
    .hz-rail { display:none !important; }
    .hz-shell { height:auto !important; min-height:100vh !important; }
    .hz-pad { padding-left:20px !important; padding-right:20px !important; }
  }
  button:hover { filter: brightness(1.1); }
  input.hf { transition: border-color .14s ease, background .14s ease, box-shadow .16s ease; width:100%; padding:12px 12px; background:#100F0C; border:1px solid #3D382E; border-radius:8px; font-family:'Instrument Sans',sans-serif; font-size:14px; color:#EFEAE0; outline:none; }
  input.hf::placeholder { color:#5A5446; }
  input.hf:hover:not(:focus) { border-color:#5A5446; background:#161510; }
  input.hf:focus { border-color:#4FB79A; box-shadow:0 0 0 3px rgba(79,183,154,.16); }
</style>
</helmet>

<div style="min-height:100vh; display:flex; font-family:'Instrument Sans',sans-serif; color:#EFEAE0; background:#100F0C;">

  <!-- LEFT: form -->
  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:48px 32px; min-width:0;">
    <div style="width:100%; max-width:400px;">

      <!-- wordmark -->
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:40px;">
        <div style="position:relative; width:34px; height:34px; flex:0 0 34px; border-radius:8px; background:#1F5C4D; overflow:hidden;">
          <div style="position:absolute; left:50%; top:5px; width:1.5px; height:6px; background:#E7C079; transform:translateX(-50%);"></div>
          <div style="position:absolute; left:50%; bottom:8px; width:16px; height:16px; border-radius:50%; background:#D99A3C; transform:translateX(-50%);"></div>
          <div style="position:absolute; left:0; right:0; bottom:0; height:10px; background:#164034;"></div>
          <div style="position:absolute; left:0; right:0; bottom:10px; height:1px; background:#0F3D33;"></div>
        </div>
        <div style="display:flex; align-items:baseline;"><span style="font-family:'Newsreader',serif; font-size:30px; font-weight:600; letter-spacing:-.01em; color:#F6F2E9;">Horae</span><span style="width:5px; height:5px; border-radius:50%; background:#D99A3C; margin-left:4px; align-self:flex-end; margin-bottom:4px;"></span></div>
      </div>

      <h1 style="font-family:'Newsreader',serif; font-size:34px; font-weight:600; letter-spacing:-.01em; margin:0 0 8px; color:#F6F2E9;">Welcome back</h1>
      <p style="font-size:14px; color:#A29C8D; margin:0 0 32px;">Sign in to your Horae workspace.</p>

      <!-- SSO -->
      <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:24px;">
        <button class="hb-secondary" style="display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding:12px 16px; background:#232019; border:1px solid #3D382E; border-radius:8px; color:#EFEAE0; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap;"><span style="font-family:'IBM Plex Mono',monospace; font-weight:600; color:#D99A3C;">G</span> Continue with Google</button>
        <button class="hb-secondary" style="display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding:12px 16px; background:#232019; border:1px solid #3D382E; border-radius:8px; color:#EFEAE0; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap;"><span style="font-family:'IBM Plex Mono',monospace; font-weight:600; color:#EFEAE0;">⌥</span> Continue with GitHub</button>
        <button class="hb-secondary" style="display:flex; align-items:center; justify-content:center; gap:12px; width:100%; padding:12px 16px; background:#232019; border:1px solid #3D382E; border-radius:8px; color:#EFEAE0; font-family:inherit; font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap;"><span style="display:inline-flex; font-family:'IBM Plex Mono',monospace; font-weight:600; color:#4FB79A;"><i class="ph ph-diamond" aria-hidden="true" style="font-size:16px; line-height:1; display:block;"></i></span> Continue with SSO / SAML</button>
      </div>

      <!-- divider -->
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:24px;"><span style="flex:1; height:1px; background:#262219;"></span><span style="font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#6A6353;">or with email</span><span style="flex:1; height:1px; background:#262219;"></span></div>

      <!-- email/password -->
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <div style="font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8F8676; margin-bottom:8px;">Work email</div>
          <input class="hf" type="email" placeholder="you@company.com" />
        </div>
        <div>
          <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px;"><span style="font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8F8676;">Password</span><a href="#" onClick="{{ forgot }}" style="font-size:12px;">Forgot?</a></div>
          <input class="hf" type="password" placeholder="••••••••" />
        </div>
        <a href="04_Timesheet.dc.html" class="hb-solid" style="display:block; text-align:center; padding:12px 16px; background:#1F5C4D; color:#F6F2E9; border:none; border-radius:8px; font-family:inherit; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 8px 24px -10px rgba(31,92,77,.6);">Sign in</a>
      </div>

      <div style="text-align:center; font-size:14px; color:#A29C8D; margin-top:24px;">New to Horae? <a href="02_Create Workspace.dc.html">Create a workspace</a></div>
    </div>
  </div>

  <!-- RIGHT: brand panel -->
  <div style="flex:0 0 46%; background:#0D1A16; border-left:1px solid #322E26; display:flex; flex-direction:column; justify-content:center; padding:64px; position:relative; overflow:hidden;">
    <div style="position:absolute; top:-80px; right:-80px; width:320px; height:320px; border-radius:50%; background:radial-gradient(circle, rgba(217,154,60,.18), transparent 70%);"></div>
    <div style="position:relative;">
      <div style="font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#4FB79A; margin-bottom:20px;">Open-source time tracking</div>
      <div style="font-family:'Newsreader',serif; font-size:38px; line-height:1.25; color:#F6F2E9; max-width:420px;">Time, turned into paper.</div>
      <div style="font-family:'Newsreader',serif; font-style:italic; font-size:18px; color:#8FAA9F; margin-top:16px; max-width:400px; line-height:1.5;">Track hours, review, and invoice — one calm, editorial workspace for the whole team.</div>
    </div>
  </div>
  <dc-import name="Toast" open="{{ forgotToast }}" message="Reset link sent to mira@fieldstone.studio" on-close="{{ hideForgot }}" hint-size="0,0"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:1000}}">
class Component extends DCLogic {
  state = {};
  renderVals() {
    return {
      forgot: (e) => { e.preventDefault(); this.setState({ forgotToast: true }); },
      forgotToast: this.state.forgotToast === true, hideForgot: () => this.setState({ forgotToast: false }),
    };
  }
}
</script>
</body>
</html>
