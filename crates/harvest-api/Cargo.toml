[package]
name = "horae-harvest-api"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
horae-core = { path = "../core", features = ["sqlx"] }
horae-harvest = { path = "../harvest" }
horae-server = { path = "../server" }
horae-api = { path = "../api" }
horae-types = { path = "../types" }
axum = "0.8"
tower-sessions = "0.14"
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
  "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
form_urlencoded = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
tracing = "0.1"

[dev-dependencies]
horae-server = { path = "../server", features = ["test-support"] }
serial_test = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
