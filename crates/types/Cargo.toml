[package]
name = "horae-types"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
horae-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# `js` lets `Uuid::now_v7` reach the browser's random source on wasm.
uuid = { version = "1", features = ["v7", "serde", "js"] }
