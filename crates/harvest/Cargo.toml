[package]
name = "horae-harvest"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# The loopback HTTP fixture and `ApiHttp::local`, for the app's importer tests.
test-support = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# Harvest hours and rates must keep their exact JSON decimals.
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
tracing = "0.1"
ureq = "2"
url = { version = "2", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync"] }
