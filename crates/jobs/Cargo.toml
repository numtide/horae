[package]
name = "horae-jobs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# Claiming a job without a worker, for the importers' tests in other crates.
test-support = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "json",
  "chrono",
] }

[dev-dependencies]
# The tests' MIGRATOR over the server's migrations.
sqlx = { version = "0.8", features = ["migrate"] }
futures-util = "0.3"
serial_test = "3"
