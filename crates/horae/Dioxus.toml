[application]
name = "horae"
default_platform = "fullstack"
out_dir = "dist"
asset_dir = "assets"

[web]
# Release builds write a brotli `.br` beside each asset; the server sends it
# to clients that accept br instead of compressing the WASM per request.
pre_compress = true

[web.app]
title = "Horae — Time Tracking"

[web.watcher]
reload_html = true
watch_path = ["src", "assets"]

[web.resource]
dev.script = []
