[package]
name = "horae"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "horae"
path = "src/main.rs"

[features]
default = []
server = [
  "serde_json/arbitrary_precision",
  "horae-core/sqlx",
  "dep:horae-server",
  "dep:horae-harvest",
  "dioxus/server",
  "dep:tokio",
  "dep:axum",
  "dep:tower-http",
  "dep:sqlx",
  "dep:tower-sessions",
  "dep:tower-sessions-sqlx-store",
  "dep:tracing-subscriber",
  "dep:csv",
  "dep:rust_xlsxwriter",
]
web = ["dioxus/web", "dep:gloo-timers"]

[dependencies]
horae-core = { path = "../core", features = [] }
horae-types = { path = "../types" }
dioxus = { version = "0.7", features = ["fullstack", "router"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
uuid = { version = "1", features = ["v7", "serde", "js"] }
anyhow = "1"
tracing = "0.1"
futures-util = "0.3"
# wasm-bindgen version must match exactly the version of wasm-bindgen-cli in nixpkgs
# that dioxus cli is built with:
#
# https://github.com/NixOS/nixpkgs/blob/0bb7ec54c8483066ec9d7720e780a5caa71f8612/pkgs/by-name/di/dioxus-cli/package.nix#L12
wasm-bindgen = "=0.2.126"

# server-only
horae-server = { path = "../server", optional = true }
horae-harvest = { path = "../harvest", optional = true }
tokio = { version = "1", features = ["full"], optional = true }
axum = { version = "0.8", features = ["macros", "multipart"], optional = true }
tower-http = { version = "0.6", features = [
  "fs",
  "compression-gzip",
  "trace",
], optional = true }
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "migrate",
], optional = true }
tower-sessions = { version = "0.14", optional = true }
tower-sessions-sqlx-store = { version = "0.15", features = [
  "postgres",
], optional = true }
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
], optional = true }
csv = { version = "1", optional = true }
rust_xlsxwriter = { version = "0.80", optional = true }

# web-only
gloo-timers = { version = "0.3", features = ["futures"], optional = true }

[dev-dependencies]
dioxus-html = { version = "0.7", features = ["serialize"] }
horae-harvest = { path = "../harvest", features = ["test-support"] }
horae-server = { path = "../server", features = ["test-support"] }
# The OAuth tests parse the authorize URL with the `url` it re-exports.
openidconnect = { version = "3", features = ["ureq"] }
proptest = { version = "1", default-features = false, features = ["std"] }
serial_test = "3"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
