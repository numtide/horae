[package]
name = "horae-api"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
# The workbook readers and CSV helper, for the `horae` crate's own tests.
test-support = ["dep:zip"]

[dependencies]
horae-core = { path = "../core", features = ["sqlx"] }
horae-types = { path = "../types" }
horae-server = { path = "../server" }
axum = "0.8"
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15", features = ["postgres"] }
sqlx = { version = "0.8", features = [
  "runtime-tokio",
  "postgres",
  "uuid",
  "chrono",
  "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v7", "serde"] }
anyhow = "1"
tracing = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
csv = "1"
rust_xlsxwriter = "0.80"
zip = { version = "2", default-features = false, features = [
  "deflate",
], optional = true }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
# Schema validation only; no remote `$ref` is ever fetched.
jsonschema = { version = "0.61", default-features = false }
horae-server = { path = "../server", features = ["test-support"] }
serial_test = "3"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
