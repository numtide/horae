[package]
name = "horae-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[features]
sqlx = ["dep:sqlx"]

[dependencies]
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
sqlx = { version = "0.8", features = ["postgres"], optional = true }
# OAuth rules (permissions::oauth): redirect URI parsing and the PKCE S256 check.
url = "2"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"

[lints.rust]
# Kani proof harnesses (`cargo kani -p horae-core`) live behind `cfg(kani)`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
