[workspace]
members = [
  "crates/horae",
  "crates/core",
  "crates/harvest",
  "crates/dioxus-lint",
]
exclude = [
  "crates/test-plugins/echo-plugin",
  "crates/test-plugins/fail-plugin",
  "vendor/dioxus-fullstack-0.7.9",
]
resolver = "2"

[patch.crates-io]
# Temporary response-body error backport; provenance and removal in vendor/PATCHES.md.
dioxus-fullstack = { path = "vendor/dioxus-fullstack-0.7.9" }

# Local builds and tests. Proc macros (sqlx, rsx!, serde) run on every build of
# the horae crate, so optimising them shortens macro expansion; line tables keep
# file:line backtraces without the full debug info that slows codegen and linking.
[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
strip = "debuginfo" # strip residual DWARF — prevents binaryen/wasm-opt crash
